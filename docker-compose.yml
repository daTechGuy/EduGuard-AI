services:
  llm:
    image: ollama/ollama:latest
    container_name: llm
    working_dir: /app
    ports:
      # Host-only: the Ollama API can create/delete models with no auth.
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - .:/app
      - ollama_storage:/root/.ollama

  opa:
    image: openpolicyagent/opa:0.68.0
    command: run --server --watch --addr=0.0.0.0:8181 /policies
    ports:
      # Host-only: OPA's API can replace the policy with no auth.
      - "127.0.0.1:8181:8181"
    volumes:
      - ./policies:/policies:ro

  web:
    image: python:3.11-slim
    working_dir: /app
    # Installs deps on every start so requirements.txt changes (e.g. if
    # you add a package for a lab variant) take effect without rebuilding
    # an image. Fine for a classroom sandbox; not meant for production.
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python lab/scripts/secure_gateway.py"
    ports:
      # Host-only by default. For a classroom server other machines must
      # reach, start with WEB_BIND=0.0.0.0 GRIZZDOG_ALLOWED_HOSTS='*'.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5000}:5000"
    volumes:
      - .:/app
    environment:
      # Points the gateway at the `llm` service by Compose network name,
      # NOT localhost — the web container's localhost is itself, not the
      # llm container. secure_gateway.py reads this via os.environ.
      OLLAMA_HOST: http://llm:11434
      OPA_ENABLED: "true"
      OPA_URL: http://opa:8181/v1/data/gateway/decision
      OPA_FAIL_OPEN: "false"
      CONTEXT_MODEL: llama3.2
      # Instructor-only key for signing Canvas lab reports. Leave unset on
      # student machines; reports are then marked UNSIGNED.
      REPORT_SECRET: ${REPORT_SECRET:-}
      # Inside the container the app must listen on all interfaces; the
      # port mapping above decides who can actually reach it.
      GRIZZDOG_HOST: 0.0.0.0
      # Host-header allowlist (DNS-rebinding defense); '*' to disable.
      GRIZZDOG_ALLOWED_HOSTS: ${GRIZZDOG_ALLOWED_HOSTS:-${EDUGUARD_ALLOWED_HOSTS:-localhost,127.0.0.1}}
      # Set to 1 on booth laptops: locks the page to the booth, disables editing.
      GRIZZDOG_KIOSK: ${GRIZZDOG_KIOSK:-${EDUGUARD_KIOSK:-0}}
    depends_on:
      - llm
      - opa

volumes:
  ollama_storage: